<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>El imán</title>
<style>
  canvas.lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

</style>
</head>
<body>

<main class="escena entrada"><canvas class="lienzo" id="l"></canvas></main>
<p class="pista">Junta todas las zanahorias junto al imán</p>
<p class="subpista" id="sub"></p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
function lienzoCompleto(el) { const dpr = Math.min(devicePixelRatio || 1, 2), c = el.getContext("2d");
    const aj = () => { el.width = innerWidth * dpr; el.height = innerHeight * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }; aj(); addEventListener("resize", aj); return c; }
  Comun.pistas(["Las zanahorias ruedan hacia donde inclinas el móvil.", "El imán está en el rincón de abajo a la izquierda.", "Inclina el móvil hacia abajo y a la izquierda hasta que estén todas dentro del círculo."]);
  Comun.nivel("", null);
  const ctx = lienzoCompleto(document.getElementById("l")), sub = document.getElementById("sub");
  let ax = 0, ay = 0, sensor = false, dedo = null, hecho = false, quieto = 0, ultimo = performance.now(), base = null;
  const zs = Array.from({ length: 5 }, (_, i) => ({ x: innerWidth * (.3 + i * .12), y: innerHeight * (.3 + (i % 2) * .15), vx: 0, vy: 0, a: Math.random() * 6 }));
  function alMover(e) { const g = Comun.gravedad(e); if (!g) return; sensor = true; if (!base) base = { x: g.x, y: g.y }; ax = g.x - base.x; ay = g.y - base.y; }
  addEventListener("pointerdown", e => { if (sensor) base = null; else dedo = [e.clientX, e.clientY]; });
  addEventListener("pointermove", e => { if (dedo) dedo = [e.clientX, e.clientY]; });
  addEventListener("pointerup", () => { dedo = null; if (!sensor) ax = ay = 0; });
  Comun.inicio("Unas zanahorias de metal", "Entrar", async () => {
    if (await Comun.pedirMovimiento()) addEventListener("devicemotion", alMover);
    setTimeout(() => { if (!sensor) sub.textContent = "Sin sensor: mantén el dedo hacia donde quieras que rueden"; }, 2000);
    requestAnimationFrame(bucle);
  });
  function bucle(ahora) {
    const dt = Math.min(ahora - ultimo, 50) / 1000; ultimo = ahora;
    const W = innerWidth, H = innerHeight, mx = 60, my = H - 150, R = 70, top = 120, bottom = H - 80;
    if (!sensor && dedo) { ax = (dedo[0] - W / 2) / W * 12; ay = (dedo[1] - H / 2) / H * 12; }
    let dentro = 0;
    zs.forEach(z => {
      z.vx = (z.vx + ax * 90 * dt) * .97; z.vy = (z.vy + ay * 90 * dt) * .97;
      const dm = Math.hypot(z.x - mx, z.y - my); if (dm < R * 1.6) { z.vx += (mx - z.x) * dt * 2; z.vy += (my - z.y) * dt * 2; }
      z.x += z.vx * dt; z.y += z.vy * dt;
      if (z.x < 20) { z.x = 20; z.vx *= -.4; } if (z.x > W - 20) { z.x = W - 20; z.vx *= -.4; }
      if (z.y < top) { z.y = top; z.vy *= -.4; } if (z.y > bottom) { z.y = bottom; z.vy *= -.4; }
      z.a += (z.vx + z.vy) * dt * .02;
      if (Math.hypot(z.x - mx, z.y - my) < R) dentro++;
    });
    if (!hecho) { quieto = dentro === zs.length ? quieto + dt : 0; if (quieto > .8) { hecho = true; Comun.tono(523.25,0,.8,.12,"sine");Comun.tono(659.25,.12,.8,.12,"sine");Comun.tono(783.99,.24,1,.12,"sine");Comun.vibrar([30,50,30]); setTimeout(() => Comun.superado("sonido.html"), 1500); } }
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = "rgba(233,166,184,.7)"; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(mx, my, R, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 12; ctx.lineCap = "butt"; ctx.strokeStyle = "#E53935"; ctx.beginPath(); ctx.arc(mx, my, 22, Math.PI * .1, Math.PI * .9, true); ctx.stroke();
    ctx.strokeStyle = "#B0BEC5"; ctx.beginPath(); ctx.moveTo(mx + 21, my + 6); ctx.lineTo(mx + 21, my + 16); ctx.moveTo(mx - 21, my + 6); ctx.lineTo(mx - 21, my + 16); ctx.stroke();
    zs.forEach(z => { ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(z.a);
      ctx.fillStyle = "#B0BEC5"; ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(6, -14); ctx.lineTo(0, 18); ctx.fill();
      ctx.strokeStyle = "#78909C"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-5, -24); ctx.moveTo(0, -14); ctx.lineTo(5, -24); ctx.stroke(); ctx.restore(); });
    requestAnimationFrame(bucle);
  }

</script>
</body>
</html>
