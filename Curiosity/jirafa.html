<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>La jirafa</title>
<style>.barra-q { position: absolute; left: 20%; right: 20%; bottom: calc(env(safe-area-inset-bottom) + 100px); height: 5px; border-radius: 3px; background: rgba(243,235,221,.15); }
  .barra-q span { display: block; height: 100%; width: 0; background: #F3EBDD; border-radius: 3px; }
  .jirafa { position: absolute; left: 50%; top: 54%; width: min(52vw, 230px); transform: translate(-50%, -50%); }
  .jirafa svg { width: 100%; display: block; }
  .zz { opacity: 0; transition: opacity 1s; } .duerme .zz { opacity: 1; } .duerme .ojo-a { opacity: 0; } .ojo-c { opacity: 0; } .duerme .ojo-c { opacity: 1; }
</style>
</head>
<body class="tema-papel">

<main class="escena entrada" id="escena">
  <div class="jirafa"><svg viewBox="0 0 200 300">
    <path d="M70 290 L74 200 L66 200 L62 290Z M128 290 L132 200 L124 200 L120 290Z M92 290 L94 210 M108 290 L106 210" stroke="#C99A55" stroke-width="9" fill="#C99A55"/>
    <ellipse cx="100" cy="190" rx="52" ry="30" fill="#D9AC62"/>
    <path d="M118 175 L150 50 L166 52 L140 182Z" fill="#D9AC62"/>
    <path d="M146 40 C150 22 178 22 188 34 L192 48 C182 56 164 58 150 56Z" fill="#D9AC62"/>
    <path d="M152 26 L150 12 M162 24 L163 10" stroke="#8A6A3A" stroke-width="4" stroke-linecap="round"/>
    <g fill="#9A6B34" opacity=".75"><circle cx="80" cy="185" r="7"/><circle cx="104" cy="178" r="8"/><circle cx="126" cy="192" r="6"/><circle cx="92" cy="200" r="5"/><circle cx="140" cy="140" r="5"/><circle cx="146" cy="105" r="5"/><circle cx="153" cy="75" r="4"/></g>
    <circle class="ojo-a" cx="170" cy="38" r="3" fill="#1A1208"/><path class="ojo-c" d="M166 38 Q170 41 174 38" stroke="#1A1208" stroke-width="2" fill="none"/>
    <text class="zz" x="178" y="14" font-family="Georgia" font-style="italic" font-size="18" fill="#F3EBDD">z z</text>
  </svg></div>
  <div class="barra-q"><span id="barra"></span></div>
</main>
<p class="pista">La jirafa tiene sueño</p>
<p class="subpista" id="sub" style="bottom:calc(env(safe-area-inset-bottom) + 120px)"></p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script src="plantillas.js"></script>
<script>

  Comun.pistas(["Las jirafas casi nunca se tumban para dormir.", "Pon el móvil de pie, bien vertical, como está la jirafa.", "Mantén el móvil vertical y quieto durante cinco segundos."]);
  Comun.nivel("", null);
  const escena = document.getElementById("escena"), barra = document.getElementById("barra"), sub = document.getElementById("sub");
  let p = 0, vertical = false, sensor = false, dedo = false, hecho = false, ultimo = performance.now();
  function alOrientar(e) { if (e.beta == null) return; sensor = true; vertical = e.beta > 72 && e.beta < 108 && Math.abs(e.gamma) < 20; }
  document.querySelector(".jirafa").addEventListener("pointerdown", () => { if (!sensor) dedo = true; });
  addEventListener("pointerup", () => dedo = false);
  Comun.inicio("La jirafa tiene sueño", "Empezar", async () => {
    if (await Comun.pedirOrientacion()) addEventListener("deviceorientation", alOrientar);
    setTimeout(() => { if (!sensor) sub.textContent = "Sin sensor: mantén el dedo sobre la jirafa"; }, 2000);
    requestAnimationFrame(function bucle(ahora) {
      const dt = Math.min(ahora - ultimo, 50); ultimo = ahora;
      if (!hecho) {
        const ok = sensor ? vertical : dedo;
        p = ok ? Math.min(1, p + dt / 5000) : Math.max(0, p - dt / 600);
        barra.style.width = (p * 100) + "%";
        if (p >= 1) { hecho = true; escena.classList.add("duerme"); Plantilla.exito(); }
      }
      requestAnimationFrame(bucle);
    });
  });

</script>
</body>
</html>
