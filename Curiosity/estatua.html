<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Quieto</title>
<style>
  canvas.lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .barra-q { position: absolute; left: 20%; right: 20%; bottom: calc(env(safe-area-inset-bottom) + 100px); height: 5px; border-radius: 3px; background: rgba(243,235,221,.15); }
  .barra-q span { display: block; height: 100%; width: 0; background: #F3EBDD; border-radius: 3px; }

</style>
</head>
<body>

<main class="escena entrada"><canvas class="lienzo" id="l"></canvas><div class="barra-q"><span id="barra"></span></div></main>
<p class="pista">Una mariposa quiere posarse</p>
<p class="subpista" id="sub"></p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
function lienzoCompleto(el) { const dpr = Math.min(devicePixelRatio || 1, 2), c = el.getContext("2d");
    const aj = () => { el.width = innerWidth * dpr; el.height = innerHeight * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }; aj(); addEventListener("resize", aj); return c; }
  Comun.pistas(["Las mariposas se asustan con facilidad.", "Cualquier movimiento la espanta.", "Deja el móvil completamente quieto (por ejemplo, apoyado en la mesa) durante cinco segundos."]);
  Comun.nivel("", null);
  const ctx = lienzoCompleto(document.getElementById("l")), barra = document.getElementById("barra"), sub = document.getElementById("sub");
  let p = 0, movido = 0, sensor = false, dedo = null, hecho = false, ultimo = performance.now(), t0 = performance.now(), prev = null;
  function alMover(e) {
    const g = Comun.gravedad(e); if (!g) return; sensor = true;
    if (prev) movido = Math.max(movido * .9, Math.hypot(g.x - prev.x, g.y - prev.y, g.z - prev.z));
    prev = g;
  }
  addEventListener("pointerdown", e => { if (!sensor) dedo = [e.clientX, e.clientY]; });
  addEventListener("pointermove", e => { if (dedo && Math.hypot(e.clientX - dedo[0], e.clientY - dedo[1]) > 8) { p = 0; dedo = [e.clientX, e.clientY]; } });
  addEventListener("pointerup", () => dedo = null);
  Comun.inicio("Una mariposa revolotea", "Mirar", async () => {
    if (await Comun.pedirMovimiento()) addEventListener("devicemotion", alMover);
    setTimeout(() => { if (!sensor) sub.textContent = "Sin sensor: deja el dedo quieto en la pantalla"; }, 2000);
    requestAnimationFrame(bucle);
  });
  function bucle(ahora) {
    const dt = Math.min(ahora - ultimo, 50); ultimo = ahora;
    if (!hecho) {
      const quieto = sensor ? movido < .35 : dedo !== null;
      if (quieto) p = Math.min(1, p + dt / 5000);
      else { if (p > .1) Comun.tono(1200, 0, .05, .04, "sine"); p = Math.max(0, p - dt / 400); }
      if (p >= 1) { hecho = true; Comun.tono(523.25,0,.8,.12,"sine");Comun.tono(659.25,.12,.8,.12,"sine");Comun.tono(783.99,.24,1,.12,"sine");Comun.vibrar([30,50,30]); setTimeout(() => Comun.superado("diente.html"), 1800); }
    }
    barra.style.width = (p * 100) + "%";
    const W = innerWidth, H = innerHeight, t = (ahora - t0) / 1000;
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H * .6;
    ctx.fillStyle = "#FBFAF4";
    ctx.beginPath(); ctx.ellipse(cx - 22, cy - 95, 13, 42, -.2, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx + 22, cy - 95, 13, 42, .2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy - 20, 50, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(cx, cy + 60, 62, 50, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#16292B"; ctx.beginPath(); ctx.arc(cx - 18, cy - 28, 5, 0, 7); ctx.arc(cx + 18, cy - 28, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#D9A441"; ctx.beginPath(); ctx.ellipse(cx, cy - 10, 7, 5, 0, 0, 7); ctx.fill();
    // la mariposa se acerca a la nariz a medida que avanza la quietud
    const lejos = 1 - p, bx = cx + Math.sin(t * 1.7) * 110 * lejos, by = cy - 12 - 150 * lejos + Math.cos(t * 2.3) * 40 * lejos;
    const aleteo = hecho ? .3 : Math.abs(Math.sin(t * 14)) * .8 + .2;
    ctx.fillStyle = "#FFB74D";
    ctx.beginPath(); ctx.ellipse(bx - 9, by - 8, 10 * aleteo, 12, -.5, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(bx + 9, by - 8, 10 * aleteo, 12, .5, 0, 7); ctx.fill();
    ctx.fillStyle = "#E57373"; ctx.beginPath(); ctx.ellipse(bx - 6, by + 6, 6 * aleteo, 8, -.6, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(bx + 6, by + 6, 6 * aleteo, 8, .6, 0, 7); ctx.fill();
    ctx.fillStyle = "#3E2A1A"; ctx.fillRect(bx - 1.5, by - 12, 3, 22);
    requestAnimationFrame(bucle);
  }

</script>
</body>
</html>
