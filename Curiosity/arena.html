<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Reloj de arena</title>
<style>
  canvas.lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

</style>
</head>
<body>

<main class="escena entrada"><canvas class="lienzo" id="l"></canvas></main>
<p class="pista">Haz que caiga toda la arena</p>
<p class="subpista" id="sub"></p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
function lienzoCompleto(el) { const dpr = Math.min(devicePixelRatio || 1, 2), c = el.getContext("2d");
    const aj = () => { el.width = innerWidth * dpr; el.height = innerHeight * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }; aj(); addEventListener("resize", aj); return c; }
  Comun.pistas(["Toda la arena está abajo… así no va a caer.", "¿Qué se hace con un reloj de arena para que empiece?", "Pon el móvil boca abajo y espera a que caiga toda la arena."]);
  Comun.nivel("", null);
  const ctx = lienzoCompleto(document.getElementById("l")), sub = document.getElementById("sub");
  let travesura = true, arriba = 0, girado = 0, objetivoGiro = 0, sensor = false, hecho = false, ultimo = performance.now();
  function alMover(e) { const g = Comun.gravedad(e); if (!g) return; sensor = true; if (Math.abs(g.y) > 5) objetivoGiro = g.y < 0 ? 180 : 0; }
  addEventListener("pointerdown", () => { if (!sensor) objetivoGiro = objetivoGiro ? 0 : 180; });
  Comun.inicio("Un reloj de arena", "Mirar", async () => {
    if (await Comun.pedirMovimiento()) addEventListener("devicemotion", alMover);
    setTimeout(() => { if (!sensor) sub.textContent = "Toca la pantalla para darle la vuelta"; }, 2000);
    requestAnimationFrame(bucle);
  });
  function bucle(ahora) {
    const dt = Math.min(ahora - ultimo, 50) / 1000; ultimo = ahora;
    girado += (objetivoGiro - girado) * .15;
    // si está boca abajo, la arena de «abajo» cae hacia la otra mitad
    if (!hecho && !travesura && arriba > .82) {
      travesura = true; arriba = .5;
      Comun.sombra(innerWidth * .78, innerHeight * .78, "¡Jiji! Una vueltecita más", 2800);
      Comun.vibrar([30, 40, 30]);
    }
    if (!hecho && objetivoGiro === 180 && Math.abs(girado - 180) < 20) { arriba = Math.min(1, arriba + dt / 8); if (Math.random() < .3) Comun.tono(2000 + Math.random() * 2000, 0, .02, .01, "sine"); }
    if (!hecho && objetivoGiro === 0 && Math.abs(girado) < 20 && arriba > 0) arriba = Math.max(0, arriba - dt / 8);
    if (!hecho && arriba >= 1) { hecho = true; Comun.tono(523.25,0,.8,.12,"sine");Comun.tono(659.25,.12,.8,.12,"sine");Comun.tono(783.99,.24,1,.12,"sine");Comun.vibrar([30,50,30]); sub.textContent = "¡Tiempo!"; setTimeout(() => Comun.superado("estatua.html"), 1800); }
    const W = innerWidth, H = innerHeight, a = Math.min(W * .32, 120), h = a * 1.6;
    ctx.clearRect(0, 0, W, H); ctx.save(); ctx.translate(W / 2, H * .5); ctx.rotate(girado * Math.PI / 180);
    const bulbo = (s) => { ctx.beginPath(); ctx.moveTo(-a, s * h); ctx.lineTo(a, s * h); ctx.lineTo(8, 0); ctx.lineTo(-8, 0); ctx.closePath(); };
    // arena de la mitad de abajo (1 - arriba) y de la de arriba (arriba)
    const arenaEn = (s, f) => { if (f <= 0) return; const lvl = Math.sqrt(f); ctx.save(); bulbo(s); ctx.clip(); ctx.fillStyle = "#E8C77A"; ctx.fillRect(-a, s > 0 ? h * (1 - lvl) : -h, a * 2, h * lvl); ctx.restore(); };
    arenaEn(1, 1 - arriba); arenaEn(-1, arriba);
    ctx.strokeStyle = "rgba(243,235,221,.85)"; ctx.lineWidth = 3; bulbo(1); ctx.stroke(); bulbo(-1); ctx.stroke();
    ctx.fillStyle = "#8D6E4A"; ctx.fillRect(-a - 14, -h - 10, a * 2 + 28, 10); ctx.fillRect(-a - 14, h, a * 2 + 28, 10);
    if (objetivoGiro === 180 && arriba < 1 && arriba > 0) { ctx.fillStyle = "#E8C77A"; ctx.fillRect(-1.5, 0, 3, h * (1 - Math.sqrt(arriba)) * .9); }
    ctx.restore();
    requestAnimationFrame(bucle);
  }

</script>
</body>
</html>
