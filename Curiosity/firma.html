<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Firma</title>
<style>

</style>
</head>
<body>

<main class="escena entrada">
  <button class="boton-musica" id="tocar" style="top:24%" aria-label="Escuchar">♪</button>
  <div id="piano"></div>
</main>
<p class="pista">Un compositor escondió su nombre en estas notas</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script src="motor.js"></script>
<script>

  Comun.pistas(["Escucha las cuatro notas y búscalas en el piano.", "Son si♭, la, do y si. En Alemania las notas se escriben con letras, y allí si♭ es B y si es H.", "B, A, C, H: un compositor alemán."]);
  Comun.nivel("", { sibladosi: "Esas son las notas. ¿Cómo se escriben en alemán?", baca: "Casi. En alemán, si natural es H", beethoven: "Ese ya salió" });
  const p = Motor.piano(document.getElementById("piano"), { desde: 60, hasta: 72, etiquetas: "es" });
  let sonando = false;
  document.getElementById("tocar").addEventListener("click", async () => {
    if (sonando) return; sonando = true;
    await Motor.melodia([70, 69, 72, { n: 71, d: 2 }], { pulso: .6, alNota: (n, ms) => p.iluminar(n, ms) });
    sonando = false;
  });

</script>
</body>
</html>
