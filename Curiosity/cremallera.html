<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>La cremallera</title>
<style>
  canvas.cr { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); touch-action: none; }
  .oculto-txt { position: absolute; left: 0; right: 0; top: 33%; transform: translateY(-50%); text-align: center; font-size: clamp(15px, 4.2vw, 20px); line-height: 1.35; padding: 0 27vw; color: #F3EBDD; pointer-events: none; }
</style>
</head>
<body>

<main class="escena entrada" style="background:#3A3F52">
  <p class="oculto-txt">Ahora mira una cremallera de verdad: en tu ropa, tu mochila o tu estuche</p>
  <canvas class="cr" id="cr"></canvas>
</main>
<p class="pista">¿Qué tres letras aparecen en casi todas las cremalleras?</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script src="plantillas.js"></script>
<script>

  Comun.pistas(["Abre la cremallera de la pantalla tirando del tirador hacia abajo.", "Busca una cremallera de verdad y fíjate en el tirador, la pieza que agarras para abrirla.", "Son tres letras: Y, K y K."]);
  Comun.nivel("", { yk: "Te falta una letra", kky: "En otro orden", zip: "Esa es la palabra en inglés. ¿Qué pone en el tirador?" });
  const lz = document.getElementById("cr"), c = lz.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.min(innerWidth * .9, 360), H = Math.min(innerHeight * .62, 520);
  lz.width = W * dpr; lz.height = H * dpr; lz.style.width = W + "px"; lz.style.height = H + "px"; c.setTransform(dpr, 0, 0, dpr, 0, 0);
  let abierta = 0, arr = null;   // 0 = cerrada, 1 = abierta del todo
  const y0 = 20, y1 = H - 20, cx = W / 2;
  function pintar() {
    c.clearRect(0, 0, W, H);
    const ys = y0 + (y1 - y0) * abierta;
    // tela: se separa por arriba a medida que baja el tirador
    for (const lado of [-1, 1]) {
      c.fillStyle = lado < 0 ? "#2B3A55" : "#24324B"; c.beginPath();
      c.moveTo(lado < 0 ? 0 : W, 0); c.lineTo(cx + lado * (abierta * W * .38 + 4), y0); c.lineTo(cx + lado * 4, ys); c.lineTo(cx + lado * 4, H); c.lineTo(lado < 0 ? 0 : W, H); c.fill();
    }
    // dientes
    for (let y = y0; y < y1; y += 9) {
      const sep = y < ys ? (1 - (y - y0) / Math.max(1, ys - y0)) * abierta * W * .38 : 0;
      c.fillStyle = "#C9CED8";
      c.fillRect(cx - 8 - sep, y, 9, 5); c.fillRect(cx - 1 + sep, y + 4, 9, 5);
    }
    // tirador
    c.fillStyle = "#AEB4C2"; c.beginPath(); c.roundRect(cx - 14, ys - 12, 28, 26, 5); c.fill();
    c.fillStyle = "#8C93A3"; c.beginPath(); c.roundRect(cx - 9, ys + 12, 18, 46, 6); c.fill();
    c.fillStyle = "#3A3F52"; c.beginPath(); c.roundRect(cx - 4, ys + 42, 8, 10, 3); c.fill();
  }
  pintar();
  const pos = e => { const r = lz.getBoundingClientRect(); return e.clientY - r.top; };
  lz.addEventListener("pointerdown", e => { const ys = y0 + (y1 - y0) * abierta; if (Math.abs(pos(e) - ys - 20) < 60) { arr = pos(e) - ys; lz.setPointerCapture(e.pointerId); } });
  lz.addEventListener("pointermove", e => { if (arr == null) return; const antes = abierta; abierta = Math.max(0, Math.min(1, (pos(e) - arr - y0) / (y1 - y0)));
    if (Math.floor(antes * 40) !== Math.floor(abierta * 40)) Comun.tono(2400 + Math.random() * 600, 0, .02, .03, "square"); pintar(); });
  lz.addEventListener("pointerup", () => arr = null);

</script>
</body>
</html>
