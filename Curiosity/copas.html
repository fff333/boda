<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Copas</title>
<style>
  canvas.lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .mesa-c { position: absolute; left: 50%; top: 56%; transform: translate(-50%, -50%); display: flex; gap: 3vw; align-items: flex-end; }
  .copa { width: 15vw; max-width: 66px; background: none; border: none; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .copa svg { width: 100%; display: block; }
  .copa .n { height: 20px; color: #D9A441; font-style: normal; font-size: 16px; }
  .copa.suena svg { animation: vib .05s 10; }
  @keyframes vib { 50% { transform: translateX(1.5px); } }

</style>
</head>
<body>

<main class="escena entrada"><div class="mesa-c" id="mesa"></div></main>
<p class="pista">Toca las copas de la más grave a la más aguda</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>

  Comun.pistas(["Cada copa suena distinto según el agua que tiene.", "Cuanta más agua tiene una copa, más grave suena.", "Empieza por la copa con más agua y termina por la que tiene menos."]);
  Comun.nivel("", null);
  const AGUA = [.85, .7, .55, .4, .25], FREQ = [523.25, 587.33, 659.25, 783.99, 880];
  const orden = [2, 4, 0, 3, 1], mesa = document.getElementById("mesa");
  let paso = 0, hecho = false;
  orden.forEach(i => {
    const b = document.createElement("button"); b.className = "copa";
    const y = 10 + (1 - AGUA[i]) * 70;
    b.innerHTML = `<span class="n"></span><svg viewBox="0 0 60 130"><path d="M5 5 L55 5 L48 80 Q30 92 12 80Z" fill="rgba(243,235,221,.12)" stroke="#F3EBDD" stroke-width="2"/>
      <clipPath id="c${i}"><path d="M5 5 L55 5 L48 80 Q30 92 12 80Z"/></clipPath><rect x="0" y="${y}" width="60" height="100" fill="rgba(100,181,246,.7)" clip-path="url(#c${i})"/>
      <line x1="30" y1="88" x2="30" y2="122" stroke="#F3EBDD" stroke-width="3"/><ellipse cx="30" cy="124" rx="18" ry="4" fill="#F3EBDD"/></svg>`;
    b.addEventListener("click", () => {
      b.classList.remove("suena"); void b.offsetWidth; b.classList.add("suena");
      [1, 2.76].forEach((k, j) => Comun.tono(FREQ[i] * k, 0, 1.6, j ? .03 : .15, "sine"));
      if (hecho || b.querySelector(".n").textContent) return;
      if (i === paso) { paso++; b.querySelector(".n").textContent = paso; if (paso === 5) { hecho = true; setTimeout(() => { Comun.tono(523.25,0,.8,.12,"sine");Comun.tono(659.25,.12,.8,.12,"sine");Comun.tono(783.99,.24,1,.12,"sine");Comun.vibrar([30,50,30]); }, 600); setTimeout(() => Comun.superado("cantar.html"), 2200); } }
      else { setTimeout(() => Comun.avisar("Esa no es la siguiente. Vuelve a empezar"), 300); paso = 0; mesa.querySelectorAll(".n").forEach(n => n.textContent = ""); }
    });
    mesa.appendChild(b);
  });

</script>
</body>
</html>
