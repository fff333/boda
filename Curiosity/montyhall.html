<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Tres puertas</title>
<style>
  .puertas { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); display: flex; gap: 4vw; }
  .puerta { width: 26vw; max-width: 110px; aspect-ratio: .6; border-radius: 10px 10px 0 0; border: 3px solid #C9A86A; background: #6D4C33; color: #F2E9C9; font: inherit; font-size: 34px; font-style: normal; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .3s; }
  .puerta.elegida { outline: 3px solid #E9A6B8; outline-offset: 4px; }
  .puerta.abierta { background: #141B36; font-size: 46px; }
  .decision { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 110px); display: none; justify-content: center; gap: 12px; }
  .decision.visible { display: flex; }
  .decision button { font: inherit; font-size: 18px; color: #0B1020; background: #F2E9C9; border: none; border-radius: 30px; padding: 12px 22px; cursor: pointer; }
  .estado { position: absolute; left: 0; right: 0; top: 68%; text-align: center; font-size: 19px; padding: 0 8vw; }
</style>
</head>
<body>

<main class="escena entrada">
  <div class="puertas" id="puertas"></div>
  <p class="estado" id="estado">Elige una puerta</p>
  <div class="decision" id="decision"><button id="cambiar">Cambiar de puerta</button><button id="quedar">Quedarme</button></div>
</main>
<p class="pista">Detrás de una puerta hay un coche. Detrás de las otras dos, cabras</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script src="plantillas.js"></script>
<script>

  Comun.pistas(["Elige una puerta. El presentador, que sabe dónde está el coche, abrirá otra con una cabra.", "Cuando elegiste, tu puerta tenía 1 posibilidad entre 3. ¿Ha cambiado eso?", "Cambiar de puerta gana 2 de cada 3 veces."]);
  Comun.nivel("", null);
  const cont = document.getElementById("puertas"), estado = document.getElementById("estado"), decision = document.getElementById("decision");
  let elegida = null, abierta = null, hecho = false, fase = 0;
  const ps = [0, 1, 2].map(i => { const b = document.createElement("button"); b.className = "puerta"; b.textContent = i + 1; b.addEventListener("click", () => elegir(i)); cont.appendChild(b); return b; });
  function reiniciar() { elegida = abierta = null; fase = 0; ps.forEach((b, i) => { b.className = "puerta"; b.textContent = i + 1; }); estado.textContent = "Elige una puerta"; decision.classList.remove("visible"); }
  function elegir(i) {
    if (hecho || fase !== 0) return; elegida = i; fase = 1; ps[i].classList.add("elegida"); Comun.tono(500, 0, .1, .08, "sine");
    const otras = [0, 1, 2].filter(k => k !== i); abierta = otras[Math.floor(Math.random() * 2)];
    setTimeout(() => { ps[abierta].classList.add("abierta"); ps[abierta].textContent = "🐐"; Comun.tono(220, 0, .3, .1, "sine"); estado.textContent = `El presentador abre la puerta ${abierta + 1}: una cabra. ¿Cambias?`; decision.classList.add("visible"); }, 700);
  }
  document.getElementById("cambiar").addEventListener("click", () => {
    if (fase !== 1) return; fase = 2; decision.classList.remove("visible");
    const otra = [0, 1, 2].find(k => k !== elegida && k !== abierta);
    ps[elegida].classList.remove("elegida"); ps[otra].classList.add("elegida", "abierta"); ps[otra].textContent = "🚗"; estado.textContent = "¡Coche! Cambiar era la buena idea";
    hecho = true; Plantilla.exito();
  });
  document.getElementById("quedar").addEventListener("click", () => {
    if (fase !== 1) return; fase = 2; decision.classList.remove("visible");
    ps[elegida].classList.add("abierta"); ps[elegida].textContent = "🐐"; estado.textContent = "Otra cabra… ¿Seguro que quedarse es lo mejor?";
    Plantilla.fallo(null); setTimeout(reiniciar, 2200);
  });

</script>
</body>
</html>
