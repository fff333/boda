<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16292B">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Despegue</title>
<style>

  .cohete { position: absolute; left: 50%; top: 56%; width: min(26vw, 110px); transform: translate(-50%, -50%); transition: transform 2.5s cubic-bezier(.6,0,.9,.5); }
  .cohete svg { width: 100%; display: block; overflow: visible; }
  .despega .cohete { transform: translate(-50%, -260%); }
  .fuego { opacity: 0; } .despega .fuego { opacity: 1; animation: fuego .1s infinite alternate; }
  @keyframes fuego { to { transform: scaleY(1.3); } }

</style>
</head>
<body>

<main class="escena entrada" id="escena">
  <div class="cohete"><svg viewBox="0 0 60 140">
    <path class="fuego" d="M20 110 L30 140 L40 110Z" fill="#FFB74D" style="transform-origin:30px 110px"/>
    <path d="M30 0 C50 25 48 70 44 105 L16 105 C12 70 10 25 30 0Z" fill="#F3EBDD"/>
    <circle cx="30" cy="45" r="8" fill="#64B5F6"/><path d="M16 80 L4 110 L16 105Z M44 80 L56 110 L44 105Z" fill="#E53935"/>
  </svg></div>
  <button class="boton-texto centro" id="contar" style="left:50%;right:auto;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 100px)">Escuchar la cuenta atrás</button>
</main>
<p class="pista">¿Desde qué número empezó la cuenta atrás?</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>

  Comun.pistas(["Escucha con atención: cada pitido es un número.", "Cuenta los pitidos hasta que despega.", "Hay tantos pitidos como dedos en las manos."]);
  Comun.nivel("", { diez: "Escríbelo con números", "9": "Te falta uno", "11": "Te sobra uno" });
  const escena = document.getElementById("escena"), boton = document.getElementById("contar");
  let ocupado = false;
  boton.addEventListener("click", () => {
    if (ocupado) return; ocupado = true; escena.classList.remove("despega");
    for (let i = 0; i < 10; i++) Comun.tono(880, .4 + i * .75, .12, .15, "sine");
    setTimeout(() => { escena.classList.add("despega"); Comun.tono(110, 0, 2, .2, "sawtooth"); Comun.vibrar(400); }, 400 + 10 * 750);
    setTimeout(() => { escena.classList.remove("despega"); ocupado = false; }, 400 + 10 * 750 + 4000);
  });

</script>
</body>
</html>
