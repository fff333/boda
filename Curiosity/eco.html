<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Narciso</title>
<style>
  .valle { background: linear-gradient(#141B36 0%, #2A3966 60%, #3B4A7A 100%); }
  .montes { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 55%; }
  .montes.sacudir { animation: sacudir .5s ease; }
  @keyframes sacudir { 30% { transform: translateY(3px); } 60% { transform: translateY(-2px); } }
  .letras {
    position: absolute; left: 0; right: 0; top: 30%;
    display: flex; justify-content: center; gap: 4vw;
    font-size: clamp(40px, 13vw, 76px); pointer-events: none;
  }
  .letras span { animation: llegar 1.2s ease both; }
  @keyframes llegar {
    0% { opacity: 0; transform: translateY(40px) scale(.4); filter: blur(8px); }
    60% { opacity: 1; filter: blur(0); }
    100% { opacity: .9; transform: none; }
  }
  .onda {
    position: absolute; left: 50%; bottom: 12%; width: 40px; height: 40px; margin-left: -20px;
    border-radius: 50%; border: 2px solid var(--crema); opacity: 0; pointer-events: none;
  }
  .onda.activa { animation: onda 1s ease-out; }
  @keyframes onda { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(9); } }
</style>
</head>
<body>
<main class="escena valle entrada" id="escena">
  <svg class="montes" id="montes" viewBox="0 0 400 400" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 400 L0 210 L70 120 L120 180 L190 60 L260 170 L310 110 L400 220 L400 400Z" fill="#1E2747"/>
    <path d="M190 60 L170 92 L183 88 L192 100 L205 86 L214 92Z" fill="#C9CFE0" opacity=".8"/>
    <path d="M0 400 L0 290 L90 220 L160 270 L240 200 L320 260 L400 230 L400 400Z" fill="#141B36"/>
    <path d="M0 400 L0 340 L120 310 L230 335 L330 305 L400 320 L400 400Z" fill="#0B1020"/>
  </svg>
  <div class="onda" id="onda"></div>
  <div class="letras" id="letras" aria-live="polite"></div>
</main>
<p class="pista" id="pista">Grita a la montaña</p>
<p class="subpista" id="sub"></p>
<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
  Comun.pistas(["La montaña solo responde si le hablas en voz alta.", "Grita varias veces hasta que deje de devolverte letras.", "Lee las letras de derecha a izquierda: es el sonido de un animal de granja."]);
  Comun.nivel("VIII", { joler: "El eco no se equivoca. Tú sí", eco: "Ya estás en él" });

  const RESPUESTA = "CAUC"; // la montaña lo devuelve al revés
  const letras = document.getElementById("letras"), montes = document.getElementById("montes");
  const onda = document.getElementById("onda"), sub = document.getElementById("sub");
  const pista = document.getElementById("pista");
  let medir = null, ultimoGrito = 0, indice = 0, ocupado = false;

  function grito() {
    const ahora = performance.now();
    if (ocupado || ahora - ultimoGrito < 900) return;
    ultimoGrito = ahora; ocupado = true;
    onda.classList.remove("activa"); void onda.offsetWidth; onda.classList.add("activa");
    if (indice >= RESPUESTA.length) { letras.innerHTML = ""; indice = 0; }
    setTimeout(() => {
      montes.classList.remove("sacudir"); void montes.offsetWidth; montes.classList.add("sacudir");
      [0, .28, .56].forEach((d, i) => Comun.tono(330 - i * 20, d, .35, .16 / (i + 1), "sine"));
      Comun.vibrar([30, 250, 20, 250, 10]);
      const s = document.createElement("span");
      s.textContent = RESPUESTA[indice++];
      letras.appendChild(s);
      if (indice === RESPUESTA.length) {
        setTimeout(() => { pista.textContent = "El eco siempre devuelve las cosas del revés"; }, 1200);
      }
      ocupado = false;
    }, 700);
  }

  // Sin micrófono: tocar la montaña cuenta como grito
  montes.addEventListener("pointerdown", () => { if (!medir) grito(); });

  Comun.inicio("Has llegado a un valle", "Entrar", async () => {
    medir = await Comun.pedirMicro();
    if (!medir) sub.textContent = "Sin micrófono: toca la montaña";
    (function escuchar() {
      if (medir && medir() > .12) grito();
      requestAnimationFrame(escuchar);
    })();
  });
</script>
</body>
</html>
