<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Algo naranja</title>
<style>
  .ventana { position: absolute; left: 50%; top: 50%; width: min(70vw, 320px); aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 50%; overflow: hidden; background: #141B36; border: 3px solid rgba(242,233,201,.3); }
  .ventana video { width: 100%; height: 100%; object-fit: cover; }
  .anillo { position: absolute; left: 50%; top: 50%; width: min(70vw, 320px); transform: translate(-50%, -50%) rotate(-90deg); pointer-events: none; }
  .mira { position: absolute; left: 50%; top: 50%; width: 30%; aspect-ratio: 1; transform: translate(-50%, -50%); border: 2px dashed rgba(255,255,255,.7); border-radius: 50%; pointer-events: none; }
  .conejo { position: absolute; left: 14%; bottom: calc(env(safe-area-inset-bottom) + 90px); width: 22vw; max-width: 100px; }
  .conejo.come svg { animation: masticar .2s ease 6; }
  @keyframes masticar { 50% { transform: scaleY(.94); } }
  .opciones { position: absolute; left: 0; right: 0; bottom: 30%; display: none; justify-content: center; gap: 16px; }
  .sin-camara .opciones { display: flex; } .sin-camara .ventana, .sin-camara .anillo { display: none; }
  .opcion { width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer; }
</style>
</head>
<body>
<main class="escena entrada" id="escena">
  <div class="ventana"><video id="video" playsinline muted autoplay></video><div class="mira"></div></div>
  <svg class="anillo" viewBox="0 0 100 100"><circle id="progreso" cx="50" cy="50" r="48" fill="none" stroke="#FB8C00" stroke-width="3" stroke-dasharray="301.6" stroke-dashoffset="301.6"/></svg>
  <div class="opciones">
    <button class="opcion" style="background:#E53935" data-ok="0" aria-label="Rojo"></button>
    <button class="opcion" style="background:#FB8C00" data-ok="1" aria-label="Naranja"></button>
    <button class="opcion" style="background:#43A047" data-ok="0" aria-label="Verde"></button>
    <button class="opcion" style="background:#1E88E5" data-ok="0" aria-label="Azul"></button>
  </div>
  <div class="conejo" id="conejo"><svg viewBox="0 0 120 130"><ellipse cx="48" cy="28" rx="9" ry="28" fill="#FBFAF4" transform="rotate(-12 48 28)"/><ellipse cx="48" cy="30" rx="4" ry="20" fill="#E9A6B8" transform="rotate(-12 48 30)"/><ellipse cx="70" cy="26" rx="9" ry="28" fill="#FBFAF4" transform="rotate(10 70 26)"/><ellipse cx="70" cy="28" rx="4" ry="20" fill="#E9A6B8" transform="rotate(10 70 28)"/><ellipse cx="62" cy="100" rx="38" ry="28" fill="#FBFAF4"/><circle cx="98" cy="100" r="9" fill="#FBFAF4"/><circle cx="56" cy="66" r="24" fill="#FBFAF4"/><circle cx="47" cy="63" r="3.4" fill="#0B1020"/><ellipse cx="36" cy="72" rx="3" ry="2.2" fill="#E9A6B8"/></svg></div>
</main>
<p class="pista">El conejito tiene hambre. Enséñale algo de su color favorito</p>
<p class="subpista" id="sub"></p>
<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
  Comun.pistas(["Al conejito le encanta un color.", "Es el color de las zanahorias.", "Busca algo naranja (una naranja, una zanahoria, un juguete…) y ponlo dentro del círculo de la cámara."]);
  Comun.nivel("XXV", null);
  const escena = document.getElementById("escena"), video = document.getElementById("video"), progreso = document.getElementById("progreso");
  const conejo = document.getElementById("conejo"), sub = document.getElementById("sub");
  const lienzo = document.createElement("canvas"); lienzo.width = 24; lienzo.height = 24;
  const c = lienzo.getContext("2d", { willReadFrequently: true });
  let flujo = null, p = 0, hecho = false;
  function comer() {
    if (hecho) return; hecho = true;
    conejo.classList.add("come");
    for (let i = 0; i < 6; i++) Comun.tono(300 + Math.random() * 100, i * .2, .08, .12, "square");
    Comun.vibrar([20, 180, 20, 180, 20]);
    if (flujo) flujo.getTracks().forEach(t => t.stop());
    setTimeout(() => Comun.superado("tarde.html", "XXV"), 1600);
  }
  function hsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    let h = 0;
    if (d) h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(h * 60 + 360) % 360, max ? d / max : 0, max];
  }
  document.querySelectorAll(".opcion").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.ok === "1") comer(); else { Comun.tono(160, 0, .2, .12, "sine"); Comun.avisar("Ese no le gusta"); }
  }));
  Comun.inicio("Un conejito con hambre", "Abrir la cámara", async () => {
    try {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 320 }, height: { ideal: 320 } }, audio: false });
      video.srcObject = flujo; await video.play();
    } catch (e) { escena.classList.add("sin-camara"); sub.textContent = "Sin cámara: elige el color que le gusta"; return; }
    (function medir() {
      if (hecho) return;
      if (video.readyState >= 2) {
        const w = video.videoWidth, h = video.videoHeight, t = Math.min(w, h) * .3;
        c.drawImage(video, (w - t) / 2, (h - t) / 2, t, t, 0, 0, 24, 24);
        const d = c.getImageData(0, 0, 24, 24).data; let r = 0, g = 0, b = 0;
        for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
        const n = d.length / 4, [hu, sa, va] = hsv(r / n, g / n, b / n);
        const naranja = hu >= 8 && hu <= 45 && sa > .45 && va > .3;
        p = naranja ? Math.min(1, p + .12) : Math.max(0, p - .08);
        progreso.setAttribute("stroke-dashoffset", 301.6 * (1 - p));
        if (p >= 1) comer();
      }
      setTimeout(medir, 120);
    })();
  });
</script>
</body>
</html>
