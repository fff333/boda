<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1020">
<title>Valoraciones</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #0B1020; color: #F2E9C9; font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 500; }
  body { min-height: 100dvh; padding: calc(env(safe-area-inset-top) + 24px) 6vw 40px; }
  h1 { font-weight: 500; font-size: clamp(30px, 9vw, 46px); text-align: center; margin-bottom: 6px; }
  .sub { text-align: center; opacity: .55; font-size: 15px; margin-bottom: 22px; }
  table { width: 100%; max-width: 560px; margin: 0 auto; border-collapse: collapse; font-size: 16px; }
  th { font-weight: 500; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; opacity: .5; font-style: normal; padding: 8px 6px; text-align: left; }
  td { padding: 10px 6px; border-top: 1px solid rgba(242,233,201,.12); }
  td.num { font-style: normal; text-align: right; width: 1%; white-space: nowrap; }
  tr.yo td { color: #FFD54F; }
  .barra { height: 8px; border-radius: 4px; background: #E9A6B8; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .barra.d { background: #64B5F6; }
  .enlaces { display: flex; gap: 10px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .enlaces a { color: #F2E9C9; text-decoration: none; border: 1px solid rgba(242,233,201,.3); border-radius: 30px; padding: 10px 18px; font-size: 15px; }
  .estado { text-align: center; opacity: .6; margin: 30px 0; }
</style>
</head>
<body>
  <h1>📊 Valoraciones</h1>
  <p class="sub">Media de las puntuaciones de los jugadores (de 1 a 5)</p>
  <p class="estado" id="estado">Cargando…</p>
  <table id="tabla" hidden><thead><tr><th>Nivel</th><th>Diversión</th><th>Dificultad</th><th>Votos</th></tr></thead><tbody></tbody></table>
  <div class="enlaces"><a href="ranking.html">← Ranking</a><a href="index.html">Volver al juego</a></div>
<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
  const estado = document.getElementById("estado"), tabla = document.getElementById("tabla");
  const barra = (v, cls) => v ? `<span class="barra ${cls}" style="width:${v * 14}px"></span>${v.toFixed(1)}` : "—";
  if (!Comun.servidor) estado.textContent = "Las valoraciones aún no están configuradas.";
  else fetch(Comun.servidor + "?tipo=estadisticas").then(r => r.json()).then(lista => {
    if (!lista.length) { estado.textContent = "Todavía no hay valoraciones."; return; }
    estado.hidden = true; tabla.hidden = false;
    const cuerpo = tabla.querySelector("tbody");
    lista.forEach(f => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="num">${f.nivel}</td><td>${barra(f.diversion, "")}</td><td>${barra(f.dificultad, "d")}</td><td class="num">${f.votos}</td>`;
      cuerpo.appendChild(tr);
    });
  }).catch(() => { estado.textContent = "No se han podido cargar las valoraciones."; });
</script>
</body>
</html>
