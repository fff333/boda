<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Seis bombillas</title>
<style>

  .fila { position: absolute; left: 50%; top: 48%; transform: translate(-50%, -50%); display: flex; gap: 3vw; }
  .bombilla { width: 11vw; max-width: 54px; }
  .bombilla svg { width: 100%; display: block; overflow: visible; }
  .on .cristal { fill: #FFE082; filter: drop-shadow(0 0 12px #FFD54F); }

</style>
</head>
<body>

<main class="escena entrada"><div class="fila" id="fila"></div></main>
<p class="pista">Seis bombillas guardan un número</p>
<p class="subpista">Dicen que es la respuesta a todo</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>

  Comun.pistas(["Encendida o apagada: solo hay dos posibilidades.", "Es binario. De derecha a izquierda, las bombillas valen 1, 2, 4, 8, 16 y 32.", "Suma el valor de las encendidas: 32 + 8 + 2."]);
  Comun.nivel("", { "101010": "Eso es en binario. ¿Y en números normales?", cuarentaydos: "Escríbelo con números", "21": "Léelo de izquierda a derecha" });
  const fila = document.getElementById("fila");
  [1, 0, 1, 0, 1, 0].forEach(b => {
    const d = document.createElement("div"); d.className = "bombilla" + (b ? " on" : "");
    d.innerHTML = `<svg viewBox="0 0 40 70"><circle class="cristal" cx="20" cy="22" r="18" fill="#2A3966" stroke="#F2E9C9" stroke-opacity=".4"/><rect x="12" y="40" width="16" height="14" rx="2" fill="#9AA3B8"/><rect x="14" y="56" width="12" height="6" rx="2" fill="#6B7491"/></svg>`;
    fila.appendChild(d);
  });

</script>
</body>
</html>
