<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Luz</title>
<style>

  .optica { position: absolute; left: 50%; top: 52%; width: min(92vw, 420px); transform: translate(-50%, -50%); touch-action: none; }
  .optica svg { width: 100%; display: block; overflow: visible; }
  .colores { opacity: 0; transition: opacity .3s; }
  .alineado .colores { opacity: 1; }

</style>
</head>
<body>

<main class="escena entrada" id="escena">
  <div class="optica" id="optica"><svg viewBox="0 0 400 300">
    <line x1="0" y1="150" x2="170" y2="150" stroke="#FFFFFF" stroke-width="4"/>
    <g class="colores" stroke-width="5">
      <line x1="225" y1="160" x2="400" y2="110" stroke="#E53935"/><line x1="225" y1="160" x2="400" y2="135" stroke="#FB8C00"/>
      <line x1="225" y1="160" x2="400" y2="160" stroke="#FDD835"/><line x1="225" y1="160" x2="400" y2="185" stroke="#43A047"/>
      <line x1="225" y1="160" x2="400" y2="210" stroke="#1E88E5"/><line x1="225" y1="160" x2="400" y2="235" stroke="#3949AB"/>
      <line x1="225" y1="160" x2="400" y2="260" stroke="#8E24AA"/>
    </g>
    <g id="prisma"><path d="M200 95 L250 185 L150 185Z" fill="rgba(200,220,255,.35)" stroke="#F2E9C9" stroke-width="2"/></g>
  </svg></div>
</main>
<p class="pista">Abre la luz en colores</p>
<p class="subpista">Gira el prisma con el dedo</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script src="motor.js"></script>
<script>

  Comun.pistas(["La luz blanca esconde todos los colores.", "Gira el prisma arrastrando el dedo en círculo a su alrededor.", "Cuando una punta del triángulo apunte justo hacia arriba, la luz se abrirá."]);
  Comun.nivel("", null);
  const optica = document.getElementById("optica"), prisma = document.getElementById("prisma"), escena = document.getElementById("escena");
  let ang = 47, prev = null, hecho = false, quieto = null;
  const centro = () => { const r = optica.getBoundingClientRect(); return [r.left + r.width * .5, r.top + r.height * (155 / 300)]; };
  const a = e => { const [cx, cy] = centro(); return Math.atan2(e.clientY - cy, e.clientX - cx) * 180 / Math.PI; };
  function pintar() {
    prisma.setAttribute("transform", `rotate(${ang} 200 155)`);
    const err = Math.abs(((ang % 120) + 120 + 60) % 120 - 60);
    const ok = err < 6; escena.classList.toggle("alineado", ok);
    if (ok && !hecho) { quieto = quieto || setTimeout(() => { hecho = true; Motor.exito(() => Comun.superado("prisma.html")); }, 900); }
    else if (!ok && quieto) { clearTimeout(quieto); quieto = null; }
  }
  pintar();
  optica.addEventListener("pointerdown", e => { prev = a(e); optica.setPointerCapture(e.pointerId); Comun.audio(); });
  optica.addEventListener("pointermove", e => { if (prev == null || hecho) return; const x = a(e); let d = x - prev; if (d > 180) d -= 360; if (d < -180) d += 360; ang += d; prev = x; pintar(); });
  optica.addEventListener("pointerup", () => prev = null);

</script>
</body>
</html>
