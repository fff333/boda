<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Cinco puntas</title>
<style>
  .noche { background: radial-gradient(ellipse at 50% 20%, #1E2A4A 0%, #0B1020 75%); }
  .estrella { position: absolute; width: 64px; height: 64px; transform: translate(-50%, -50%); border: none; background: none; cursor: pointer; }
  .estrella svg { width: 100%; display: block; transition: transform .3s, filter .3s; opacity: .35; animation: titila 2.5s ease-in-out infinite; }
  .estrella.encendida svg { opacity: 1; animation: none; transform: scale(1.3); filter: drop-shadow(0 0 12px #FFE9A0); }
  @keyframes titila { 50% { opacity: .15; } }
</style>
</head>
<body>
<main class="escena noche entrada" id="cielo"></main>
<p class="pista">Enciende el cielo</p>
<script src="comun.js"></script>
<script>
  Comun.pistas(["Hay algo en el cielo que brilla muy poco.", "Toca las estrellas apagadas.", "Son cinco. Tócalas todas."]);
  Comun.nivel("XV", null);
  const SITIOS = [[24,30],[72,24],[50,48],[20,68],[78,64]];
  const NOTAS = [523.25, 587.33, 659.25, 783.99, 880];
  const cielo = document.getElementById("cielo");
  let encendidas = 0;
  SITIOS.forEach(([x, y], i) => {
    const b = document.createElement("button");
    b.className = "estrella"; b.setAttribute("aria-label", "Estrella");
    b.style.left = x + "%"; b.style.top = y + "%";
    b.style.animationDelay = (i * .4) + "s";
    b.innerHTML = `<svg viewBox="0 0 50 50"><path d="M25 3 L31 19 L48 19 L34 29 L39 46 L25 36 L11 46 L16 29 L2 19 L19 19Z" fill="#FFE9A0"/></svg>`;
    b.addEventListener("pointerdown", () => {
      if (b.classList.contains("encendida")) return;
      b.classList.add("encendida");
      Comun.tono(NOTAS[encendidas], 0, .8, .18, "sine"); Comun.vibrar(15);
      if (++encendidas === SITIOS.length) setTimeout(() => Comun.superado("nube.html", "XV"), 900);
    });
    cielo.appendChild(b);
  });
</script>
</body>
</html>
