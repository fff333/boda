<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<title>Adivinanza 2</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0B1020;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  .franjas {
    position: fixed; inset: 0;
    height: 100dvh;
    display: flex; flex-direction: column;
    opacity: 0; animation: entrar 1s ease forwards;
  }
  @keyframes entrar { to { opacity: 1; } }
  .franja {
    flex: 1;
    border: none; outline: none;
    cursor: pointer;
    transition: background-color .25s ease, filter .15s ease;
  }
  .franja:active { filter: brightness(1.15); }
  .franja:focus-visible { outline: 3px solid #F2E9C9; outline-offset: -6px; }

  .pista {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 2.2vh);
    left: 0; right: 0; text-align: center;
    font-family: "Fraunces", Georgia, serif;
    font-style: italic; font-weight: 500;
    font-size: clamp(16px, 4.6vw, 24px);
    color: #FFFFFF;
    text-shadow: 0 1px 8px rgba(0,0,0,.55);
    pointer-events: none;
  }

  /* Al acertar */
  .franjas.resuelto .franja { pointer-events: none; animation: brillo 1.2s ease forwards; }
  .franjas.resuelto .franja:nth-child(2) { animation-delay: .08s; }
  .franjas.resuelto .franja:nth-child(3) { animation-delay: .16s; }
  .franjas.resuelto .franja:nth-child(4) { animation-delay: .24s; }
  .franjas.resuelto .franja:nth-child(5) { animation-delay: .32s; }
  .franjas.resuelto .franja:nth-child(6) { animation-delay: .40s; }
  .franjas.resuelto .franja:nth-child(7) { animation-delay: .48s; }
  @keyframes brillo {
    0% { filter: brightness(1); }
    40% { filter: brightness(1.6); }
    100% { filter: brightness(1.1); }
  }
  .velo {
    position: fixed; inset: 0; background: #0B1020;
    opacity: 0; pointer-events: none; transition: opacity .8s ease 1.3s;
  }
  .velo.activo { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .franjas { animation: none; opacity: 1; }
    .franjas.resuelto .franja { animation: none; }
  }
</style>
</head>
<body>
  <main class="franjas" id="franjas"></main>
  <p class="pista">De mayor a menor</p>
  <div class="velo" id="velo"></div>

<script src="comun.js"></script>
<script>
  Comun.pistas(["Siete franjas, siete colores. ¿Dónde has visto eso en el cielo?", "«Mayor a menor» se refiere a la longitud de onda de la luz.", "De arriba abajo: rojo, naranja, amarillo, verde, azul, añil y violeta."]);
  Comun.nivel("III", null);
  const SIGUIENTE = "espejo.html";

  // Colores del arcoíris ordenados de mayor a menor longitud de onda
  const COLORES = [
    { nombre: "rojo",     hex: "#E53935" },
    { nombre: "naranja",  hex: "#FB8C00" },
    { nombre: "amarillo", hex: "#FDD835" },
    { nombre: "verde",    hex: "#43A047" },
    { nombre: "azul",     hex: "#1E88E5" },
    { nombre: "añil",     hex: "#3949AB" },
    { nombre: "violeta",  hex: "#8E24AA" }
  ];
  // Cada color tiene una nota (escala de do mayor) para que suene distinto
  const NOTAS = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88];

  const contenedor = document.getElementById("franjas");
  const velo = document.getElementById("velo");
  let estado = [];
  let resuelto = false;
  let audioCtx = null;

  function nota(freq, cuando = 0, dur = 0.25, vol = 0.25) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const t = audioCtx.currentTime + cuando;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur + 0.05);
    } catch (e) {}
  }

  // Estado inicial aleatorio que nunca sea ya la solución
  function aleatorio() {
    let s;
    do {
      s = Array.from({ length: 7 }, () => Math.floor(Math.random() * 7));
    } while (s.every((c, i) => c === i));
    return s;
  }

  function pintar(i) {
    const b = contenedor.children[i];
    b.style.backgroundColor = COLORES[estado[i]].hex;
    b.setAttribute("aria-label", `Franja ${i + 1}: ${COLORES[estado[i]].nombre}`);
  }

  function comprobar() {
    if (estado.every((c, i) => c === i)) {
      resuelto = true;
      contenedor.classList.add("resuelto");
      if (navigator.vibrate) navigator.vibrate([40, 60, 40, 60, 120]);
      NOTAS.forEach((f, i) => nota(f, 0.15 + i * 0.09, 0.4, 0.2));
      nota(523.25, 0.15 + 7 * 0.09, 0.9, 0.25);
      setTimeout(() => Comun.superado(SIGUIENTE, "III"), 1500);
    }
  }

  function tocar(i, ev) {
    if (resuelto) return;
    if (ev) ev.preventDefault();
    estado[i] = (estado[i] + 1) % 7;
    pintar(i);
    nota(NOTAS[estado[i]]);
    if (navigator.vibrate) navigator.vibrate(10);
    comprobar();
  }

  function iniciar() {
    resuelto = false;
    estado = aleatorio();
    contenedor.classList.remove("resuelto");
    velo.classList.remove("activo");
    contenedor.innerHTML = "";
    estado.forEach((_, i) => {
      const b = document.createElement("button");
      b.className = "franja";
      b.addEventListener("pointerdown", ev => tocar(i, ev));
      b.addEventListener("keydown", ev => {
        if (ev.key === "Enter" || ev.key === " ") tocar(i, ev);
      });
      contenedor.appendChild(b);
      pintar(i);
    });
  }

  iniciar();
  // Si se vuelve atrás desde la adivinanza 3, empezar de nuevo
  window.addEventListener("pageshow", e => { if (e.persisted) iniciar(); });
</script>
</body>
</html>
