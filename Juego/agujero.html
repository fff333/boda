<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Mirilla</title>
<style>
  .pared { position: absolute; width: 260vw; height: 200vh; left: 0; top: 0;
    background: repeating-linear-gradient(90deg, #6B5442 0 38px, #5E4939 38px 40px), #6B5442; }
  .pared .t { position: absolute; color: #F2E9C9; font-size: clamp(20px, 6vw, 30px); line-height: 1.3; opacity: .9; transform: rotate(var(--r, 0deg)); white-space: nowrap; }
  .tapa { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle var(--rad, 80px) at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 92%, #000 100%); }
</style>
</head>
<body>
<main class="escena entrada" style="overflow:hidden">
  <div class="pared" id="pared">
    <div class="t" style="left:12%;top:14%;--r:-6deg">Aquí no hay nada</div>
    <div class="t" style="left:58%;top:10%;--r:4deg">✿ ✿ ✿</div>
    <div class="t" style="left:8%;top:62%;--r:3deg">Sigue mirando</div>
    <div class="t" style="left:70%;top:72%;--r:-3deg">Patas de una araña<br>× patas de un gato</div>
    <div class="t" style="left:40%;top:40%;--r:-2deg">¿Quién anda ahí?</div>
    <div class="t" style="left:80%;top:30%;--r:8deg">☾</div>
    <div class="t" style="left:30%;top:85%;--r:-5deg">Frío, frío…</div>
  </div>
  <div class="tapa" id="tapa"></div>
</main>
<p class="pista" style="z-index:7">Al otro lado hay alguien que escribe en las paredes</p>
<p class="subpista" id="sub" style="z-index:7"></p>
<script src="comun.js"></script>
<script>
  Comun.pistas(["Inclina el móvil para mirar hacia los lados a través de la mirilla.", "En algún rincón hay una operación escrita.", "Una araña tiene 8 patas y un gato 4. Escribe el resultado con números."]);
  Comun.nivel("XXXVIII", { treintaydos: "Escríbelo con números", "12": "No las sumes", "84": "Hazlo con números: ocho por cuatro", "8x4": "Ahora haz la cuenta" });
  const pared = document.getElementById("pared"), tapa = document.getElementById("tapa"), sub = document.getElementById("sub");
  let W = innerWidth, H = innerHeight;
  tapa.style.setProperty("--rad", Math.min(W, H) * .2 + "px");
  let px = 0, py = 0, tx = 0, ty = 0, base = null, giro = false, arr = null;
  const maxX = () => pared.offsetWidth - W, maxY = () => pared.offsetHeight - H;
  tx = px = -maxX() / 2; ty = py = -maxY() / 2;
  function alOrientar(e) {
    if (e.beta == null) return; giro = true; sub.textContent = "";
    if (!base) base = { b: e.beta, g: e.gamma };
    tx = -maxX() / 2 - (e.gamma - base.g) * (maxX() / 50);
    ty = -maxY() / 2 - (e.beta - base.b) * (maxY() / 50);
  }
  addEventListener("pointerdown", e => { if (giro) base = null; else arr = { x: e.clientX - tx, y: e.clientY - ty }; });
  addEventListener("pointermove", e => { if (arr) { tx = e.clientX - arr.x; ty = e.clientY - arr.y; } });
  addEventListener("pointerup", () => arr = null);
  Comun.inicio("Una puerta con mirilla", "Mirar", async () => {
    if (await Comun.pedirOrientacion()) addEventListener("deviceorientation", alOrientar);
    setTimeout(() => { if (!giro) sub.textContent = "Arrastra para mirar alrededor"; }, 2000);
    (function bucle() {
      tx = Math.max(-maxX(), Math.min(0, tx)); ty = Math.max(-maxY(), Math.min(0, ty));
      px += (tx - px) * .12; py += (ty - py) * .12;
      pared.style.transform = `translate(${px}px, ${py}px)`;
      requestAnimationFrame(bucle);
    })();
  });
</script>
</body>
</html>
