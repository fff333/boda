<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Nublado</title>
<style>
  .cielo-dia { background: linear-gradient(#5C7CC8 0%, #9DB8E8 100%); }
  .acertijo {
    position: absolute; left: 0; right: 0; top: 46%; transform: translateY(-50%);
    text-align: center; padding: 0 10vw; font-size: clamp(26px, 7.6vw, 40px); line-height: 1.3; color: #0B1020;
  }
  .nube { position: absolute; left: 50%; top: 46%; width: 140vw; max-width: 720px; transform: translate(-50%, -50%); cursor: grab; }
  .nube svg { width: 100%; display: block; filter: drop-shadow(0 10px 20px rgba(11,16,32,.25)); }
  .pista { color: #0B1020; }
  .numero { color: #0B1020; }
</style>
</head>
<body>
<main class="escena cielo-dia entrada">
  <p class="acertijo">Todos me buscan en invierno<br>y me huyen en verano.<br>¿Quién soy?</p>
  <div class="nube" id="nube">
    <svg viewBox="0 0 400 220"><g fill="#F4F6FB">
      <circle cx="120" cy="120" r="70"/><circle cx="200" cy="90" r="85"/><circle cx="285" cy="125" r="68"/>
      <circle cx="80" cy="150" r="50"/><circle cx="330" cy="155" r="48"/><rect x="80" y="130" width="250" height="70" rx="35"/>
    </g></svg>
  </div>
</main>
<p class="pista">Hay algo detrás de la nube</p>
<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
  Comun.pistas(["Las nubes se mueven con el viento.", "Sopla al micrófono o arrastra la nube con el dedo.", "Calienta en invierno y quema en verano. Sale de día."]);
  Comun.nivel("XVI", { luna: "Esa sale de noche", estrella: "Sí, pero ¿cuál?", elsol: "Sin el artículo", calor: "Casi. ¿Quién lo da?" });
  const nube = document.getElementById("nube");
  let x = 0, medir = null, arrastre = null;
  nube.addEventListener("pointerdown", e => { arrastre = e.clientX - x; });
  addEventListener("pointermove", e => { if (arrastre != null) x = e.clientX - arrastre; });
  addEventListener("pointerup", () => arrastre = null);
  Comun.inicio("Un día nublado", "Mirar al cielo", async () => {
    medir = await Comun.pedirMicro();
    (function bucle() {
      if (medir && medir() > .06) x += 6;
      nube.style.transform = `translate(calc(-50% + ${x}px), -50%)`;
      requestAnimationFrame(bucle);
    })();
  });
</script>
</body>
</html>
