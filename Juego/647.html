<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Sin colores</title>
<style>

</style>
</head>
<body>

<main class="escena entrada">
  <button class="boton-musica" id="tocar" style="top:24%" aria-label="Escuchar">♪</button>
  <div id="piano"></div>
</main>
<p class="pista">Repite la melodía en el piano</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script src="motor.js"></script>
<script>

  Comun.pistas(["Escucha la melodía tantas veces como quieras.", "Son cuatro notas. La primera es la más grave de todas.", "Empieza por el do (la tecla de la izquierda) y sube."]);
  Comun.nivel("", null);
  const OBJ = [60, 64, 67, 65];
  let hecho = false;
  const p = Motor.piano(document.getElementById("piano"), { desde: 60, hasta: 71, negras: false, etiquetas: null,
    alTocar: Motor.vigilar(OBJ, () => { if (!hecho) { hecho = true; Motor.exito(() => Comun.superado("oido.html")); } }) });
  let sonando = false;
  document.getElementById("tocar").addEventListener("click", async () => {
    if (sonando) return; sonando = true; await Motor.melodia(OBJ, { pulso: .55 }); sonando = false;
  });

</script>
</body>
</html>
