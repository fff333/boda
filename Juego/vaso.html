<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>El vaso</title>
<style>
  canvas.lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

</style>
</head>
<body>

<main class="escena entrada"><canvas class="lienzo" id="l"></canvas></main>
<p class="subpista" id="sub"></p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>
function lienzoCompleto(el) { const dpr = Math.min(devicePixelRatio || 1, 2), c = el.getContext("2d");
    const aj = () => { el.width = innerWidth * dpr; el.height = innerHeight * dpr; c.setTransform(dpr, 0, 0, dpr, 0, 0); }; aj(); addEventListener("resize", aj); return c; }
  Comun.pistas(["El vaso está lleno. ¿Cómo se vacía un vaso?", "Gira el móvil como si fueras a echar el agua.", "Inclínalo mucho, casi boca abajo, hasta que no quede ni una gota."]);
  Comun.nivel("", null);
  const ctx = lienzoCompleto(document.getElementById("l")), sub = document.getElementById("sub");
  let dx = 0, dy = 1, tdx = 0, tdy = 1, vol = .8, hecho = false, sensor = false, gotas = [], brote = 0, ultimo = performance.now(), arr = null;
  function alMover(e) { const g = Comun.gravedad(e); if (!g || Math.hypot(g.x, g.y) < 2) return; sensor = true; const m = Math.hypot(g.x, g.y); tdx = g.x / m; tdy = g.y / m; }
  addEventListener("pointerdown", e => { if (!sensor) arr = e.clientX; });
  addEventListener("pointermove", e => { if (arr == null) return; const a = (e.clientX - arr) / 120; tdx = Math.sin(a); tdy = Math.cos(a); });
  addEventListener("pointerup", () => arr = null);
  Comun.inicio("Un vaso lleno de agua", "Coger el vaso", async () => {
    if (await Comun.pedirMovimiento()) addEventListener("devicemotion", alMover);
    setTimeout(() => { if (!sensor) sub.textContent = "Arrastra el dedo para inclinar el vaso"; }, 2000);
    requestAnimationFrame(bucle);
  });
  function recortar(poli, nx, ny, c) {
    const out = [];
    for (let i = 0; i < poli.length; i++) {
      const a = poli[i], b = poli[(i + 1) % poli.length], da = a[0] * nx + a[1] * ny - c, db = b[0] * nx + b[1] * ny - c;
      if (da >= 0) out.push(a);
      if ((da >= 0) !== (db >= 0)) { const t = da / (da - db); out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
    }
    return out;
  }
  const area = p => Math.abs(p.reduce((s, a, i) => { const b = p[(i + 1) % p.length]; return s + a[0] * b[1] - b[0] * a[1]; }, 0)) / 2;
  function bucle(ahora) {
    const dt = Math.min(ahora - ultimo, 50) / 1000; ultimo = ahora;
    dx += (tdx - dx) * .2; dy += (tdy - dy) * .2; const m = Math.hypot(dx, dy); const nx = dx / m, ny = dy / m;
    const W = innerWidth, H = innerHeight, ancho = Math.min(W * .4, 160), alto = ancho * 1.5, x0 = W / 2 - ancho / 2, y0 = H * .45 - alto / 2, x1 = x0 + ancho, y1 = y0 + alto;
    const vaso = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], total = ancho * alto;
    const ds = vaso.map(p => p[0] * nx + p[1] * ny);
    let lo = Math.min(...ds), hi = Math.max(...ds), agua = [];
    for (let i = 0; i < 30; i++) { const c = (lo + hi) / 2; agua = recortar(vaso, nx, ny, c); if (area(agua) / total > vol) lo = c; else hi = c; }
    const c = (lo + hi) / 2;
    if (!hecho) {
      const bordes = [[x0, y0], [x1, y0]].map(p => p[0] * nx + p[1] * ny - c).filter(d => d > 0);
      if (bordes.length && vol > 0) {
        const prof = Math.max(...bordes) / alto, salida = Math.max(.15, prof * 1.2) * dt;
        vol = Math.max(0, vol - salida); brote = Math.min(1, brote + salida * 1.3);
        const lado = ([[x0, y0], [x1, y0]].find(p => p[0] * nx + p[1] * ny - c > 0));
        if (Math.random() < .6) gotas.push({ x: lado[0], y: lado[1], vx: nx * 60 + (Math.random() - .5) * 30, vy: ny * 60 });
        if (Math.random() < .1) Comun.tono(600 + Math.random() * 500, 0, .05, .03, "sine");
      }
      if (vol < .03) { hecho = true; vol = 0; Comun.tono(523.25,0,.8,.12,"sine");Comun.tono(659.25,.12,.8,.12,"sine");Comun.tono(783.99,.24,1,.12,"sine");Comun.vibrar([30,50,30]); setTimeout(() => Comun.superado("arena.html"), 1800); }
    }
    ctx.clearRect(0, 0, W, H);
    // brote de zanahoria que crece con el agua
    const sx = W * .5, sy = H * .86;
    ctx.fillStyle = "#3E2A1A"; ctx.fillRect(0, sy, W, H - sy);
    ctx.strokeStyle = "#43A047"; ctx.lineWidth = 5; ctx.lineCap = "round";
    [-1, 0, 1].forEach(k => { ctx.beginPath(); ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + k * 14 * brote, sy - 30 * brote, sx + k * 26 * brote, sy - (20 + 50 * brote)); ctx.stroke(); });
    if (brote > .8) { ctx.fillStyle = "#FB8C00"; ctx.beginPath(); ctx.moveTo(sx - 10, sy); ctx.lineTo(sx + 10, sy); ctx.lineTo(sx, sy + 40 * (brote - .8) * 5); ctx.fill(); }
    if (agua.length > 2 && vol > 0) { ctx.fillStyle = "rgba(100,181,246,.75)"; ctx.beginPath(); agua.forEach((p, i) => i ? ctx.lineTo(...p) : ctx.moveTo(...p)); ctx.fill(); }
    ctx.strokeStyle = "rgba(242,233,201,.8)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1); ctx.lineTo(x1, y0); ctx.stroke();
    gotas = gotas.filter(g => g.y < H); gotas.forEach(g => { g.vy += 900 * dt * ny; g.vx += 900 * dt * nx; g.x += g.vx * dt; g.y += g.vy * dt; ctx.fillStyle = "rgba(100,181,246,.9)"; ctx.beginPath(); ctx.arc(g.x, g.y, 3, 0, 7); ctx.fill(); });
    requestAnimationFrame(bucle);
  }

</script>
</body>
</html>
