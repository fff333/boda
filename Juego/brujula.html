<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Rumbo</title>
<style>
  .rosa { position: absolute; left: 50%; top: 58%; width: min(80vw, 380px); transform: translate(-50%, -50%); }
  .rosa svg { width: 100%; display: block; }
  #disco { transform-origin: 150px 150px; }
  .indicador { position: absolute; left: 50%; top: calc(58% - min(40vw, 190px) - 22px); transform: translateX(-50%);
    width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 16px solid var(--rosa); }
  .cielo-norte {
    position: absolute; left: 0; right: 0; top: 17%; text-align: center; padding: 0 10vw;
    font-size: clamp(22px, 6.4vw, 34px); line-height: 1.3; opacity: 0; transition: opacity 2s ease;
    text-shadow: 0 0 16px rgba(242,233,201,.5); pointer-events: none;
  }
  .cielo-norte .estrella { display: block; font-size: 40px; margin-bottom: 10px; font-style: normal; }
  .visto .cielo-norte { opacity: 1; }
  .visto .pista { opacity: 0; transition: opacity 1s; }
</style>
</head>
<body>
<main class="escena entrada" id="escena">
  <div class="cielo-norte">
    <span class="estrella" aria-hidden="true">✦</span>
    La estrella que nunca se mueve
  </div>
  <div class="indicador" aria-hidden="true"></div>
  <div class="rosa">
    <svg viewBox="0 0 300 300">
      <circle cx="150" cy="150" r="146" fill="#141B36" stroke="#F2E9C9" stroke-opacity=".3" stroke-width="2"/>
      <g id="disco">
        <path d="M150 20 L165 150 L150 135 L135 150Z" fill="#E9A6B8"/>
        <path d="M150 280 L135 150 L150 165 L165 150Z" fill="#F2E9C9" opacity=".35"/>
        <path d="M280 150 L150 165 L165 150 L150 135Z" fill="#F2E9C9" opacity=".2"/>
        <path d="M20 150 L150 135 L135 150 L150 165Z" fill="#F2E9C9" opacity=".2"/>
        <text x="150" y="16" text-anchor="middle" fill="#E9A6B8" font-family="Georgia" font-style="italic" font-size="18">N</text>
      </g>
    </svg>
  </div>
</main>
<p class="pista">Busca el norte</p>
<p class="subpista" id="sub"></p>
<script src="comun.js"></script>
<script>
  Comun.pistas(["La brújula quiere que la lleves a algún sitio.", "Gira contigo el móvil hasta que la N coincida con la flecha rosa.", "Hay una estrella que siempre marca el norte. ¿Cómo se llama?"]);
  Comun.nivel("X", { norte: "Ya lo encontraste. ¿Qué viste allí?", estrella: "¿Cuál de todas?", fija: "¿Cómo se llama?" });

  const disco = document.getElementById("disco"), escena = document.getElementById("escena");
  const sub = document.getElementById("sub");
  let rumbo = null, mostrado = 140, tieneBrujula = false, alineado = 0, visto = false;
  let ultimo = performance.now(), arrastreX = null;

  function alOrientar(e) {
    if (typeof e.webkitCompassHeading === "number") { rumbo = e.webkitCompassHeading; tieneBrujula = true; }
    else if (e.absolute && e.alpha != null) { rumbo = (360 - e.alpha) % 360; tieneBrujula = true; }
  }

  // Sin brújula: girar la rosa arrastrando el dedo
  addEventListener("pointerdown", e => { arrastreX = e.clientX; });
  addEventListener("pointermove", e => {
    if (tieneBrujula || arrastreX == null) return;
    rumbo = ((rumbo ?? 140) + (e.clientX - arrastreX) * .6 + 360) % 360;
    arrastreX = e.clientX;
  });
  addEventListener("pointerup", () => arrastreX = null);

  Comun.inicio("Te has perdido", "Sacar la brújula", async () => {
    if (await Comun.pedirOrientacion()) {
      addEventListener("deviceorientationabsolute", alOrientar);
      addEventListener("deviceorientation", alOrientar);
    }
    setTimeout(() => { if (!tieneBrujula) { rumbo = rumbo ?? 140; sub.textContent = "Sin brújula: gira la rosa con el dedo"; } }, 2500);
    requestAnimationFrame(bucle);
  });

  function bucle(ahora) {
    const dt = Math.min(ahora - ultimo, 50); ultimo = ahora;
    if (rumbo != null) {
      let d = ((rumbo - mostrado + 540) % 360) - 180;
      mostrado += d * .15;
      disco.style.transform = `rotate(${-mostrado}deg)`;
      const error = Math.abs(((rumbo + 540) % 360) - 180);
      const desvio = Math.min(error, 360 - error);
      if (!visto) {
        alineado = desvio < 12 ? alineado + dt : 0;
        if (alineado > 1200) {
          visto = true; escena.classList.add("visto"); document.body.classList.add("visto");
          [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => Comun.tono(f, i * .15, 1, .12, "sine"));
          Comun.vibrar([30, 60, 30]);
        }
      }
    }
    requestAnimationFrame(bucle);
  }
</script>
</body>
</html>
