<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Jeroglíficos</title>
<style>
  canvas.lienzo { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  .cartucho { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); min-width: 200px; height: 80px; padding: 0 22px; border: 4px solid #C9A86A; border-radius: 40px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 40px; background: rgba(201,168,106,.1); }
  .cartucho::after { content: ""; position: absolute; right: -14px; top: 10px; bottom: 10px; width: 6px; background: #C9A86A; border-radius: 3px; }
  .teclado-j { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translateX(-50%); width: min(94vw, 420px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .glifo { aspect-ratio: 1.1; border-radius: 12px; border: 1px solid rgba(201,168,106,.5); background: rgba(201,168,106,.08); color: #F2E9C9; font-size: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-family: inherit; }
  .glifo small { font-size: 12px; font-style: normal; opacity: .7; }
  .palabra-j { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 26px; letter-spacing: .3em; font-style: normal; }

</style>
</head>
<body>

<main class="escena entrada" style="background:radial-gradient(ellipse at 50% 30%, #4A3A22, #1A140C 80%)">
  <div class="cartucho" id="cartucho"></div>
  <div class="palabra-j">L U N A</div>
  <div class="teclado-j" id="teclado"></div>
</main>
<p class="pista">Escribe LUNA como un escriba egipcio</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>

  Comun.pistas(["Cada dibujo equivale a una letra. Mira la letra pequeña debajo de cada uno.", "Toca los dibujos en el orden de la palabra: primero la L.", "L es el león, U el pollito, N el agua y A el buitre."]);
  Comun.nivel("", null);
  const G = [["🦁", "L"], ["🦅", "A"], ["🐍", "F"], ["🌊", "N"], ["🦉", "M"], ["🐣", "U"], ["✋", "D"], ["👄", "R"], ["🍞", "T"], ["🦵", "B"], ["🧺", "K"], ["🌾", "I"]];
  const OBJ = "LUNA"; let escrito = "", hecho = false;
  const cartucho = document.getElementById("cartucho"), teclado = document.getElementById("teclado");
  G.forEach(([g, l]) => {
    const b = document.createElement("button"); b.className = "glifo"; b.innerHTML = `${g}<small>${l}</small>`;
    b.addEventListener("click", () => {
      if (hecho) return;
      if (l === OBJ[escrito.length]) { escrito += l; cartucho.insertAdjacentHTML("beforeend", `<span>${g}</span>`); Comun.tono(400 + escrito.length * 80, 0, .25, .12, "sine");
        if (escrito === OBJ) { hecho = true; Comun.tono(523.25,0,.8,.12,"sine");Comun.tono(659.25,.12,.8,.12,"sine");Comun.tono(783.99,.24,1,.12,"sine");Comun.vibrar([30,50,30]); setTimeout(() => Comun.superado("anubis.html"), 1600); } }
      else { Comun.tono(160, 0, .2, .1, "sine"); Comun.avisar("Esa no es la letra que toca"); }
    });
    teclado.appendChild(b);
  });

</script>
</body>
</html>
