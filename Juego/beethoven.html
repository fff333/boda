<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B1020">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="comun.css">
<title>Equilibrio</title>
<style>

  .balanzas { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: min(86vw, 360px); }
  .balanzas svg { width: 100%; display: block; overflow: visible; }
  #movil { transition: transform .5s cubic-bezier(.3,1.4,.6,1); transform-origin: 150px 372px; }
  .controles { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 96px); display: flex; justify-content: center; gap: 18px; align-items: center; }
  .controles button { width: 54px; height: 54px; border-radius: 50%; font-size: 26px; font-family: inherit; color: #F2E9C9; background: rgba(242,233,201,.08); border: 1px solid rgba(242,233,201,.35); cursor: pointer; }
  .controles span { font-size: 22px; min-width: 70px; text-align: center; }

</style>
</head>
<body>

<main class="escena entrada">
  <div class="balanzas"><svg viewBox="0 0 300 470" id="svg"></svg></div>
  <div class="controles">
    <button id="menos" aria-label="Quitar círculo">−</button>
    <span id="cuenta">0 ●</span>
    <button id="mas" aria-label="Añadir círculo">+</button>
  </div>
</main>
<p class="pista">Las balanzas no mienten. ¿Cuántos círculos pesa la estrella?</p>

<script src="idiomas.js"></script>
<script src="comun.js"></script>
<script>

  Comun.pistas(["Las dos primeras balanzas están equilibradas: te dicen cuánto pesa cada figura.", "Cuenta todo en círculos: un cuadrado pesa 2 círculos.", "Un triángulo pesa 3 círculos, y la estrella pesa dos triángulos."]);
  Comun.nivel("", { seis: "Escríbelo con números", "3": "Ese es el triángulo", "2": "Ese es el cuadrado" });
  const F = {
    c: (x, y) => `<circle cx="${x}" cy="${y - 9}" r="8" fill="#E9A6B8"/>`,
    q: (x, y) => `<rect x="${x - 9}" y="${y - 18}" width="18" height="18" fill="#64B5F6"/>`,
    t: (x, y) => `<path d="M${x} ${y - 20} L${x + 11} ${y} L${x - 11} ${y}Z" fill="#FDD835"/>`,
    e: (x, y) => { const p = []; for (let i = 0; i < 10; i++) { const r = i % 2 ? 6 : 14, a = -Math.PI / 2 + i * Math.PI / 5; p.push((x + r * Math.cos(a)).toFixed(1) + " " + (y - 12 + r * Math.sin(a)).toFixed(1)); } return `<path d="M${p.join(" L")}Z" fill="#FFB74D"/>`; }
  };
  function plato(x, y, figuras) {
    const w = 24, x0 = x - (figuras.length - 1) * w / 2;
    return `<path d="M${x - 46} ${y} Q${x} ${y + 18} ${x + 46} ${y}Z" fill="#C9A86A"/>` +
      `<line x1="${x}" y1="${y - 46}" x2="${x - 40}" y2="${y}" stroke="#C9A86A"/><line x1="${x}" y1="${y - 46}" x2="${x + 40}" y2="${y}" stroke="#C9A86A"/>` +
      figuras.map((f, i) => F[f](x0 + i * w, y)).join("");
  }
  function balanza(y, izq, der) {
    return `<path d="M150 ${y} L138 ${y + 50} L162 ${y + 50}Z" fill="#5A3D52"/><line x1="60" y1="${y}" x2="240" y2="${y}" stroke="#C9A86A" stroke-width="5" stroke-linecap="round"/>` +
      plato(60, y + 46, izq) + plato(240, y + 46, der);
  }
  const svg = document.getElementById("svg");
  let n = 0;
  function pintar() {
    const ang = Math.max(-14, Math.min(14, (6 - n) * 3));
    svg.innerHTML = balanza(20, ["q"], ["c", "c"]) + balanza(176, ["t"], ["q", "c"]) +
      `<path d="M150 332 L138 382 L162 382Z" fill="#5A3D52"/>` +
      `<g id="movil" style="transform: rotate(${-ang}deg)"><line x1="60" y1="332" x2="240" y2="332" stroke="#C9A86A" stroke-width="5" stroke-linecap="round"/>` +
      plato(60, 378, ["e"]) + plato(240, 378, Array(Math.min(n, 6)).fill("c")) +
      (n > 6 ? `<text x="240" y="420" text-anchor="middle" fill="#E9A6B8" font-size="14">+${n - 6}</text>` : "") + `</g>`;
    document.getElementById("cuenta").textContent = n + " ●";
  }
  pintar();
  function cambiar(d) {
    n = Math.max(0, Math.min(12, n + d)); pintar(); Comun.tono(400 + n * 30, 0, .12, .1, "sine");
    if (n === 6) { Comun.tono(784, .2, .6, .12, "sine"); Comun.avisar("¡Equilibrada! Escribe la respuesta"); }
  }
  document.getElementById("mas").addEventListener("click", () => cambiar(1));
  document.getElementById("menos").addEventListener("click", () => cambiar(-1));

</script>
</body>
</html>
